<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAA Policy Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css">
<script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
<style>
:root{--navy:#1F4E79;--navy2:#2E75B6;--bg:#f5f7fa;--card:#fff;--border:#dde3ea;--text:#1a2733;--muted:#61718a;
--p1:#c0392b;--p2:#b7791f;--p3:#2b6cb0;--yellow:#fff3bf;--green:#2f855a;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;opacity:.75}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:transparent;border:none;color:#cfe0f0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.active,nav button:hover{background:rgba(255,255,255,.15);color:#fff}
main{max-width:1200px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;color:var(--navy)}
.stat .l{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;background:#fff}
.filters input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-size:12.5px;position:sticky}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:top}
tr:hover td{background:#eef3f9;cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.P1{background:#fde8e6;color:var(--p1)}.P2{background:#fdf3d7;color:var(--p2)}.P3{background:#e3eefc;color:var(--p3)}
.sDraft{background:#eceff3;color:#4a5568}.sIn.Review,.sReview{background:#fdf3d7;color:var(--p2)}
.sLegal{background:#e9e3fc;color:#6b46c1}.sApproved{background:#e0f2e9;color:var(--green)}.sAdopted{background:#2f855a;color:#fff}
.sOpen{background:#fde8e6;color:var(--p1)}.sClosed{background:#e0f2e9;color:var(--green)}
.flagcount{color:var(--p1);font-weight:700}
#policyView .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:16px}
#policyView .meta div{background:#eef3f9;border-radius:7px;padding:8px 12px;font-size:12.5px}
#policyView .meta b{display:block;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.mdbody h1{color:var(--navy);font-size:24px;margin:8px 0 16px}
.mdbody h2{color:var(--navy);font-size:18px;margin:22px 0 10px;border-bottom:2px solid var(--border);padding-bottom:5px}
.mdbody h3{font-size:15px;margin:16px 0 8px}
.mdbody p,.mdbody li{line-height:1.55;margin-bottom:7px}
.mdbody ul{padding-left:22px}
.mdbody blockquote{background:var(--yellow);border-left:4px solid #e0a800;padding:10px 14px;border-radius:0 7px 7px 0;margin:10px 0}
.mdbody blockquote p{margin:0}
.mdbody table{margin:10px 0}
.mdbody table th{position:static}
.btn{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:default}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
textarea#editor{width:100%;height:65vh;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:14px;border:1px solid var(--border);border-radius:8px;line-height:1.5}
.fmedit{width:100%;border:none;background:transparent;font-size:13px;padding:2px 0;border-bottom:1px dashed #b9c6d6;outline:none}
.toastui-editor-defaultUI{border-radius:8px}
.toastui-editor-contents blockquote{background:var(--yellow);border-left:4px solid #e0a800;color:inherit}
.toastui-editor-contents p,.toastui-editor-contents li{font-size:14px;color:var(--text)}
.commitrow{display:flex;gap:10px;margin-top:10px}
.commitrow input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:7px}
#setup{max-width:520px;margin:60px auto}
#setup label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
#setup input{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-size:14px}
#setup .hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;z-index:99}
.toast.show{opacity:1}
.toast.err{background:var(--p1)}
.regnote{font-size:12px;color:var(--muted);margin:6px 0 12px}
select.inline{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px}
.hidden{display:none}
.spin{text-align:center;color:var(--muted);padding:40px}
@media(max-width:700px){main{padding:12px}td,th{padding:7px 8px;font-size:12.5px}}
</style>
</head>
<body>
<header>
  <div><h1>YAA Policy Hub</h1><div class="sub">Joint Commission BHC · standards eff. July 1, 2026</div></div>
  <nav id="nav" class="hidden">
    <button data-v="dashboard" class="active">Policies</button>
    <button data-v="register">Remediation Register</button>
    <button data-v="reminders">Reminders</button>
    <button data-v="documents">Supporting Documents</button>
    <button data-v="settings">Settings</button>
  </nav>
</header>
<main id="app"><div class="spin">Loading…</div></main>
<div id="toast" class="toast"></div>

<script>
/* ================= GitHub backend ================= */
const CFG_KEY='yaa_hub_cfg';
let cfg=JSON.parse(sessionStorage.getItem(CFG_KEY)||localStorage.getItem(CFG_KEY)||'null');
let keyring=null;
const api=(path,opts={})=>fetch(`https://api.github.com/repos/${cfg.repo}/${path}`,{
  ...opts, headers:{'Authorization':`Bearer ${cfg.token}`,'Accept':'application/vnd.github+json',
  'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function ghRead(path){
  const r=await api(`contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${cfg.branch}`);
  if(!r.ok) throw new Error(`${r.status} reading ${path}`);
  const j=await r.json(); return {text:b64d(j.content), sha:j.sha};
}
async function ghWrite(path,content,message,sha){
  const r=await api(`contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`,{method:'PUT',
    body:JSON.stringify({message,content:b64e(content),sha,branch:cfg.branch,
      committer:{name:cfg.name||'Policy Hub',email:cfg.email||'hub@youareaccountable.com'}})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(`${r.status} saving ${path}: ${j.message||''}`);}
  return (await r.json()).content.sha;
}
/* ================= state ================= */
let manifest=[], register=[], view='dashboard', current=null, shas={};
const $=s=>document.querySelector(s);
const app=$('#app');
const toast=(m,err)=>{const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',3200);};
const STATUSES=['Draft','In Review','Legal Review','Approved','Adopted'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= front matter ================= */
function parseFM(text){
  const m=text.match(/^---\n([\s\S]*?)\n---\n?/); if(!m) return {fm:{},body:text,raw:''};
  const fm={}; m[1].split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)fm[l.slice(0,i).trim()]=l.slice(i+1).trim().replace(/^"|"$/g,'').replace(/\\"/g,'"');});
  return {fm,body:text.slice(m[0].length),raw:m[0]};
}
function buildFM(fm){return '---\n'+Object.entries(fm).map(([k,v])=>`${k}: "${String(v).replace(/"/g,'\\"')}"`).join('\n')+'\n---\n\n';}
function fmtRevDate(){return new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'2-digit'});}
/* Append a Revision History log row (newest-first, right under the table header).
   Robust to a missing table or missing section — builds them if needed. */
function appendRevision(body,version,desc,author){
  const cell=s=>String(s??'').replace(/\|/g,'\\|').replace(/\n/g,' ').trim();
  const row=`| ${cell(version)} | ${fmtRevDate()} | ${cell(desc||'Version updated.')} | ${cell(author||'Team')} |`;
  const lines=body.split('\n');
  let h=-1;
  for(let i=0;i<lines.length;i++){ if(/^#{1,6}\s.*Revision History/i.test(lines[i])){ h=i; break; } }
  if(h>=0){
    for(let i=h+1;i<Math.min(lines.length,h+10);i++){
      if(/^\s*\|[\s:|-]{3,}\|\s*$/.test(lines[i])){ lines.splice(i+1,0,row); return lines.join('\n'); }
    }
    lines.splice(h+1,0,'','| Version | Date | Description | Author |','| --- | --- | --- | --- |',row);
    return lines.join('\n');
  }
  return body.replace(/\s*$/,'')+`\n\n## Revision History\n\n| Version | Date | Description | Author |\n| --- | --- | --- | --- |\n${row}\n`;
}

/* ================= PDF export (print-to-PDF) =================
   Renders policies into a print-styled document in a hidden iframe
   and opens the browser print dialog — choose "Save as PDF" there.
   True selectable text, page breaks between policies, letter size. */
const PRINT_CSS=`
@page{size:letter;margin:0.9in 0.8in;
  @bottom-center{content:"You Are Accountable, Inc. — Confidential · Page " counter(page);font-size:8.5pt;color:#61718a;font-family:Arial,sans-serif;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#1a2733;font-size:10.5pt;line-height:1.5}
.cover{page-break-after:always;display:flex;flex-direction:column;justify-content:center;min-height:8.5in;text-align:center}
.cover .org{font-size:12pt;letter-spacing:2.5px;text-transform:uppercase;color:#61718a}
.cover h1{font-size:30pt;color:#1F4E79;margin:18pt 0 6pt}
.cover .rule{width:1.6in;height:3px;background:#1F4E79;margin:14pt auto}
.cover .sub{font-size:12pt;color:#1a2733;margin-bottom:4pt}
.cover .meta{font-size:10pt;color:#61718a;margin-top:22pt;line-height:1.7}
.cover .conf{margin-top:34pt;font-size:9pt;color:#c0392b;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.toc{page-break-after:always}
.toc h2{font-size:16pt;color:#1F4E79;border-bottom:2.5px solid #1F4E79;padding-bottom:5pt;margin-bottom:12pt}
.toc table{width:100%;border-collapse:collapse;font-size:9.5pt}
.toc th{text-align:left;color:#1F4E79;border-bottom:1.5px solid #1F4E79;padding:4pt 6pt;font-size:8.5pt;text-transform:uppercase;letter-spacing:.5px}
.toc td{padding:4.5pt 6pt;border-bottom:1px solid #dde3ea;vertical-align:top}
.pol{page-break-before:always}
.pol:first-of-type{page-break-before:auto}
.pmeta{width:100%;border-collapse:collapse;margin-bottom:10pt;font-size:8.5pt}
.pmeta td{background:#eef3f9;border:2.5px solid #fff;border-radius:4px;padding:5pt 8pt;vertical-align:top;width:33.3%}
.pmeta b{display:block;color:#1F4E79;font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1pt}
.draftbar{background:#fff3bf;border-left:4px solid #e0a800;color:#7a5b00;font-weight:700;font-size:9pt;padding:5pt 9pt;margin-bottom:10pt}
.mdbody h1{color:#1F4E79;font-size:17pt;margin:0 0 10pt;page-break-after:avoid}
.mdbody h2{color:#1F4E79;font-size:12.5pt;margin:14pt 0 7pt;border-bottom:1.5px solid #dde3ea;padding-bottom:3pt;page-break-after:avoid}
.mdbody h3{font-size:11pt;margin:11pt 0 5pt;page-break-after:avoid}
.mdbody p{margin-bottom:6pt}
.mdbody li{margin-bottom:4pt}
.mdbody ul,.mdbody ol{padding-left:18pt;margin-bottom:6pt}
.mdbody blockquote{background:#fff3bf;border-left:4px solid #e0a800;padding:7pt 10pt;margin:8pt 0;page-break-inside:avoid}
.mdbody blockquote p{margin:0}
.mdbody table{width:100%;border-collapse:collapse;margin:8pt 0;font-size:9pt;page-break-inside:auto}
.mdbody th{background:#1F4E79;color:#fff;text-align:left;padding:4.5pt 7pt}
.mdbody td{border:1px solid #dde3ea;padding:4.5pt 7pt;vertical-align:top}
.mdbody tr{page-break-inside:avoid}
.mdbody hr{border:none;border-top:1px solid #dde3ea;margin:10pt 0}
.mdbody strong{color:inherit}
.mdbody a{color:#1F4E79;text-decoration:none}
.secfoot{margin-top:14pt;padding-top:6pt;border-top:1px solid #dde3ea;font-size:8pt;color:#61718a}
`;
function fmtDate(){return new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}
function policySectionHTML(fm,body){
  const status=fm.status||'Draft';
  const draft=status!=='Adopted';
  return `<section class="pol">
    <table class="pmeta"><tr>
      <td><b>Standard</b>${esc(fm.standard||fm.id)} · EP ${esc(fm.eps||'—')}</td>
      <td><b>Owner</b>${esc(fm.owner||'—')}</td>
      <td><b>Approver</b>${esc(fm.approver||'—')}</td></tr><tr>
      <td><b>Version · Status</b>${esc(fm.version||'—')} · ${esc(status)}</td>
      <td><b>Effective date</b>${esc(fm.effective_date||'—')}</td>
      <td><b>Next review</b>${esc(fm.next_review||'—')}</td>
    </tr></table>
    ${draft?'<div class="draftbar">DRAFT — not yet adopted; for internal review only</div>':''}
    <div class="mdbody">${marked.parse(body)}</div>
    <div class="secfoot">${esc(fm.standard||fm.id)} — ${esc(fm.title||'')} · ${esc(fm.version||'')} · You Are Accountable, Inc. · Printed ${fmtDate()}</div>
  </section>`;
}
function printHTML(docTitle,inner){
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+esc(docTitle)+'</title>'+
    '<style>'+PRINT_CSS+'</style></head><body>'+inner+'</body></html>';
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  f.onload=()=>{setTimeout(()=>{
    try{
      f.contentWindow.addEventListener('afterprint',()=>setTimeout(()=>f.remove(),500));
      f.contentWindow.focus();f.contentWindow.print();
      setTimeout(()=>{if(document.body.contains(f))f.remove();},120000);
    }catch(e){toast('Print failed: '+e.message,true);f.remove();}
  },400);};
  f.srcdoc=html;
}
function downloadPolicyPDF(){
  if(!current||!current.text) return;
  const {fm,body}=parseFM(current.text);
  const name=(fm.id||'policy')+' '+(fm.title||'');
  toast('Opening print dialog — choose "Save as PDF"');
  printHTML(name.trim(),policySectionHTML(fm,body));
}
function dashFiltered(){
  return manifest.filter(p=>
    (!f_ch||p.chapter===f_ch)&&(!f_pr||p.priority===f_pr)&&(!f_st||p.status===f_st)&&
    (!f_ow||p.owner.startsWith(f_ow))&&(!f_q||(p.title+p.id).toLowerCase().includes(f_q.toLowerCase())));
}
async function downloadBinder(){
  const rows=[...dashFiltered()].sort((a,b)=>a.id.localeCompare(b.id));
  if(!rows.length) return toast('No policies match the current filters',true);
  const filtered=rows.length!==manifest.length;
  const btn=$('#binderbtn'); if(btn){btn.disabled=true;btn.textContent='Assembling…';}
  const secs=[];let failed=0;
  try{
    for(let i=0;i<rows.length;i++){
      if(btn)btn.textContent=`Fetching ${i+1}/${rows.length}…`;
      try{
        const r=await ghRead(rows[i].path);
        const {fm,body}=parseFM(r.text);
        secs.push({fm:{...rows[i],...fm},body});
      }catch(e){
        failed++;
        secs.push({fm:{...rows[i]},body:`# ${rows[i].title}\n\n> ⚠ **LOAD ERROR:** This policy could not be fetched for the binder (${e.message}). Print it individually.`});
      }
    }
    const adopted=secs.filter(s=>(s.fm.status||'Draft')==='Adopted').length;
    const cover=`<div class="cover">
      <div class="org">You Are Accountable, Inc.</div>
      <h1>Policy &amp; Procedure Binder</h1>
      <div class="rule"></div>
      <div class="sub">Joint Commission Behavioral Health &amp; Human Services</div>
      <div class="sub">Standards effective July 1, 2026</div>
      <div class="meta">${rows.length} polic${rows.length===1?'y':'ies'}${filtered?' (filtered view)':''} · ${adopted} adopted · Generated ${fmtDate()}<br>
      331 Newman Springs Road, Building 3, Suite 320, Red Bank, NJ 07701</div>
      <div class="conf">Confidential — internal use only${adopted<rows.length?' · Contains draft policies not yet adopted':''}</div>
    </div>`;
    const toc=`<div class="toc"><h2>Contents</h2>
      <table><thead><tr><th style="width:16%">Standard</th><th>Policy</th><th style="width:16%">Owner</th><th style="width:14%">Version</th><th style="width:11%">Status</th></tr></thead>
      <tbody>${secs.map(s=>`<tr><td>${esc(s.fm.standard||s.fm.id)}</td><td>${esc(s.fm.title)}</td><td>${esc(String(s.fm.owner||'—').split(',')[0])}</td><td>${esc(s.fm.version||'—')}</td><td>${esc(s.fm.status||'Draft')}</td></tr>`).join('')}</tbody></table>
    </div>`;
    toast(failed?`Binder ready (${failed} polic${failed===1?'y':'ies'} failed to load) — choose "Save as PDF"`:'Opening print dialog — choose "Save as PDF"',!!failed);
    printHTML(`YAA Policy Binder — ${fmtDate()}`,cover+toc+secs.map(s=>policySectionHTML(s.fm,s.body)).join(''));
  }finally{
    if(btn){btn.disabled=false;btn.textContent='⬇ Binder PDF';}
  }
}

/* ================= password unlock (keyring) ================= */
const b64ab=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,
    {name:'AES-GCM',length:256},false,['decrypt','encrypt']);
}
async function tryUnlock(pw){
  for(const entry of keyring.users){
    try{
      const key=await deriveKey(pw,b64ab(entry.salt));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ab(entry.iv)},key,b64ab(entry.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){/* wrong password for this entry — try next */}
  }
  return null;
}
function renderUnlock(msg){
  $('#nav').classList.add('hidden');
  app.innerHTML=`<div id="setup" class="card" style="text-align:center">
    <h2 style="color:var(--navy)">YAA Policy Hub</h2>
    <p style="font-size:13.5px;color:var(--muted);margin-top:6px">Joint Commission policy library — team access</p>
    ${msg?`<p style="color:var(--p1);margin-top:10px">${esc(msg)}</p>`:''}
    <label style="text-align:left">Your password</label>
    <input id="u_pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doUnlock()">
    <div style="text-align:left;margin-top:8px"><label style="display:inline;font-weight:400;font-size:13px">
      <input type="checkbox" id="u_rem" style="width:auto"> Keep me signed in on this computer</label></div>
    <div style="margin-top:16px"><button class="btn" onclick="doUnlock()">Open</button></div>
    <div style="margin-top:16px"><a href="#" style="font-size:12px;color:var(--muted)" onclick="renderSetup();return false">Admin: connect with a GitHub token instead</a></div>
  </div>`;
  $('#u_pw').focus();
}
async function doUnlock(){
  const pw=$('#u_pw').value; if(!pw) return;
  const c=await tryUnlock(pw);
  if(!c) return renderUnlock('That password didn\'t work — check with Kiel.');
  cfg=c;
  ( $('#u_rem').checked ? localStorage : sessionStorage ).setItem(CFG_KEY,JSON.stringify(cfg));
  boot();
}
/* ================= setup (admin fallback) ================= */
function renderSetup(msg){
  $('#nav').classList.add('hidden');
  app.innerHTML=`<div id="setup" class="card">
    <h2 style="color:var(--navy)">Connect to GitHub</h2>
    ${msg?`<p style="color:var(--p1);margin-top:8px">${esc(msg)}</p>`:''}
    <label>Repository (owner/name)</label><input id="s_repo" placeholder="youareaccountable/policy-hub" value="${esc(cfg?.repo||'')}">
    <label>Branch</label><input id="s_branch" value="${esc(cfg?.branch||'main')}">
    <label>Fine-grained personal access token</label><input id="s_token" type="password" value="${esc(cfg?.token||'')}">

async function resolveFlag(i){
  const {fm,body}=parseFM(current.text);

  const text=buildFM(fm)+newBody;
  try{
    current.sha=await ghWrite(current.path,text,`Resolved: ${m[1]} — ${fm.id} [${cfg.name||'team'}]`,current.sha);

    await syncManifest();

/* ================= sync manifest from folder ================= */
async function syncFromFolder(btn){
  if(btn){btn.disabled=true;btn.textContent='Scanning…';}
  try{
    const tree=await ghTreePaths();
    const isPolicy=p=>/^policies\/(?:.*\/)?POL-[^/]+\.md$/.test(p);
    const known=new Set(manifest.map(e=>e.path));
    const treeSet=new Set(tree);
    const missing=tree.filter(p=>isPolicy(p)&&!known.has(p));
    const orphans=manifest.filter(e=>!treeSet.has(e.path)).map(e=>e.id);
    if(!missing.length){
      toast(orphans.length
        ?`In sync (${manifest.length}). Heads up: ${orphans.length} index entr${orphans.length>1?'ies':'y'} point to missing files — ${orphans.join(', ')}`
        :`Everything's in sync — ${manifest.length} policies`, !!orphans.length);
      return;
    }
    if(btn)btn.textContent=`Reading ${missing.length}…`;
    const chapByPre={}; manifest.forEach(e=>{const k=String(e.id).split('.')[0]; if(!chapByPre[k])chapByPre[k]=e.chapter;});
    const folderChapter=p=>{const seg=p.split('/'); const d=seg.length>2?seg[1]:''; return d.replace(/^\d+_/,'').replace(/_/g,' ').trim();};
    const added=[];
    for(const path of missing){
      try{
        const r=await ghRead(path);
        const {fm,body}=parseFM(r.text);
        const id=fm.id||path.split('/').pop().replace(/^POL-/,'').replace(/_.*$/,'');
        const pre=String(id).split('.')[0];
        const flags=(body.match(/^> ⚠ /gm)||[]).length;
        manifest.push({id,title:fm.title||id,
          chapter:fm.chapter||chapByPre[pre]||folderChapter(path)||'Uncategorized',
          standard:fm.standard||id,eps:fm.eps||'1',owner:fm.owner||'—',approver:fm.approver||'',
          version:fm.version||'',status:fm.status||'Draft',priority:fm.priority||'P2',
          effective_date:fm.effective_date||'',last_reviewed:fm.last_reviewed||'',next_review:fm.next_review||'',
          path,flags});
        added.push(id);
      }catch(e){/* skip unreadable file */}
    }
    if(!added.length){ toast('Found new files but none could be read',true); return; }
    if(!confirm(`Add ${added.length} policy file${added.length>1?'s':''} to the index?\n\n${added.join('\n')}\n\nThis commits data/manifest.json to GitHub.`)){
      manifest=manifest.filter(e=>known.has(e.path));  // roll back the additions
      renderDash(); return;
    }
    manifest.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
    const write=async()=>{ shas['data/manifest.json']=await ghWrite('data/manifest.json',
      JSON.stringify(manifest,null,1),
      `Sync from folder: +${added.length} (${added.join(', ')}) [${cfg.name||'team'}]`,
      shas['data/manifest.json']); };
    try{ await write(); }
    catch(e){ const m=await ghRead('data/manifest.json'); shas['data/manifest.json']=m.sha; await write(); }
    toast(`Added ${added.length} — index now ${manifest.length} policies`+(orphans.length?` (${orphans.length} orphaned entr${orphans.length>1?'ies':'y'} remain)`:''));
    renderDash();
  }catch(e){ toast('Sync failed: '+e.message,true); }
  finally{ if(btn){btn.disabled=false;btn.textContent='⟳ Sync folder';} }
}

    <select onchange="r_pr=this.value;renderRegister()"><option value="">All priorities</option><option ${r_pr==='P1'?'selected':''}>P1</option><option ${r_pr==='P2'?'selected':''}>P2</option><option ${r_pr==='P3'?'selected':''}>P3</option></select>
    <select onchange="r_ow=this.value;renderRegister()"><option value="">All owners</option>${ows.map(o=>`<option ${o===r_ow?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <select onchange="r_st=this.value;renderRegister()"><option ${r_st==='Open'?'selected':''}>Open</option><option ${r_st==='Closed'?'selected':''}>Closed</option><option ${r_st==='All'?'selected':''}>All</option></select>
  </div>
  <div class="regnote">Changes save to GitHub with full history. Close an item only when the policy text is updated AND the evidence exists.</div>
  <table><thead><tr><th>#</th><th>Pri</th><th>Policy</th><th>Finding</th><th>Owner</th><th>Legal</th><th>Status</th></tr></thead>
  <tbody>${rows.map(i=>`<tr>
    <td>${i.num}</td><td><span class="pill ${String(i.priority).slice(0,2)}">${String(i.priority).slice(0,2)}</span></td>
    <td style="white-space:nowrap">${esc(i.policy_id)}</td>
    <td>${esc(i.finding)}${i.evidence?`<br><span style="color:var(--muted);font-size:12px">Evidence: ${esc(i.evidence)}</span>`:''}</td>
    <td>${esc(String(i.owner).split('(')[0])}</td><td>${i.legal_review?'⚖️':''}</td>
    <td><select class="inline" onchange="setItem(${i.num},this.value)"><option ${i.status!=='Closed'?'selected':''}>Open</option><option ${i.status==='Closed'?'selected':''}>Closed</option></select></td>
  </tr>`).join('')}</tbody></table>`;
}
async function setItem(num,status){
  const it=register.find(i=>i.num===num); if(!it) return;
  it.status=status;
  try{
    shas['data/register.json']=await ghWrite('data/register.json',JSON.stringify(register,null,1),
      `Register #${num} → ${status} [${cfg.name||'team'}]`,shas['data/register.json']);
    toast(`Item #${num} ${status.toLowerCase()}`);
    renderRegister();
  }catch(e){
    const r=await ghRead('data/register.json'); shas['data/register.json']=r.sha;
    try{ shas['data/register.json']=await ghWrite('data/register.json',JSON.stringify(register,null,1),
      `Register #${num} → ${status} [${cfg.name||'team'}]`,shas['data/register.json']);
      toast(`Item #${num} ${status.toLowerCase()}`); renderRegister(); }
    catch(e2){ toast(e2.message,true); }
  }
}
/* ================= review reminders ================= */
const CADENCES=['Annual','Quarterly','Monthly','Semiannual','Every 2 years','Every 3 years','As needed'];
function parseReviewDate(s){ if(!s) return null; const d=new Date(s); return isNaN(d.getTime())?null:new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function startOfToday(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function policyCadence(p){
  if(p.review_cadence && CADENCES.includes(p.review_cadence)) return p.review_cadence;
  const t=((p.review_cadence||'')+' '+(p.next_review||'')).toLowerCase();
  if(/quarter/.test(t)) return 'Quarterly';
  if(/\bmonth/.test(t)) return 'Monthly';
  if(/semi|biann|twice a year|every 6 month/.test(t)) return 'Semiannual';
  if(/3\s*year|three\s*year|triennial/.test(t)) return 'Every 3 years';
  if(/2\s*year|two\s*year|bienn/.test(t)) return 'Every 2 years';
  if(/annual|yearly|every year|per year|1\s*year/.test(t)) return 'Annual';
  return 'Annual';
}
function computeNextDue(cadence, anchor){
  const base=anchor||startOfToday();
  const nextOn=(m,d)=>{let x=new Date(base.getFullYear(),m,d); if(x<=base)x=new Date(base.getFullYear()+1,m,d); return x;};
  if(cadence==='Annual') return nextOn(7,1);                       // Aug 1
  if(cadence==='Monthly'){ let x=new Date(base.getFullYear(),base.getMonth(),15); if(x<=base)x=new Date(base.getFullYear(),base.getMonth()+1,15); return x; }
  if(cadence==='Quarterly'){ const y=base.getFullYear(); const c=[[0,1],[3,1],[6,1],[9,1]].map(a=>new Date(y,a[0],a[1])); c.push(new Date(y+1,0,1)); return c.find(d=>d>base); }
  if(cadence==='Semiannual'){ const y=base.getFullYear(); const c=[new Date(y,1,1),new Date(y,7,1),new Date(y+1,1,1)]; return c.find(d=>d>base); } // Feb 1 / Aug 1
  if(cadence==='Every 2 years'||cadence==='Every 3 years'){ const n=cadence==='Every 2 years'?2:3; const target=new Date(base.getFullYear()+n,base.getMonth(),base.getDate()); let x=new Date(target.getFullYear(),7,1); if(x<target)x=new Date(target.getFullYear()+1,7,1); return x; }
  return null; // As needed
}
function dueMeta(p){
  const cad=policyCadence(p);
  const anchor=parseReviewDate(p.last_reviewed)||parseReviewDate(p.effective_date);
  const due=computeNextDue(cad,anchor);
  const days=due?Math.round((due-startOfToday())/86400000):null;
  return {cad,anchor,due,days};
}
function fmtDue(d){ return d?d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'—'; }
function renderReminders(){
  const rows=manifest.map(p=>({p,...dueMeta(p)}));
  const sched=rows.filter(r=>r.due).sort((a,b)=>a.due-b.due);
  const overdue=sched.filter(r=>r.days<0);
  const soon=sched.filter(r=>r.days>=0&&r.days<=60);
  const later=sched.filter(r=>r.days>60);
  const asneeded=rows.filter(r=>!r.due).sort((a,b)=>String(a.p.id).localeCompare(String(b.p.id)));
  const badge=r=> r.days<0?`<span class="pill P1">${-r.days}d overdue</span>`
    : r.days<=60?`<span class="pill P2">in ${r.days}d</span>`
    : `<span class="pill P3">in ${r.days}d</span>`;
  const line=r=>`<tr>
    <td onclick="openPolicy('${esc(r.p.path).replace(/'/g,"\\'")}')" style="cursor:pointer">${esc(r.p.id)}</td>
    <td onclick="openPolicy('${esc(r.p.path).replace(/'/g,"\\'")}')" style="cursor:pointer"><b>${esc(r.p.title)}</b></td>
    <td>${esc(String(r.p.owner||'—').split(',')[0])}</td>
    <td>${esc(r.cad)}</td>
    <td>${esc(r.p.last_reviewed||'—')}</td>
    <td style="white-space:nowrap">${r.due?`<b>${fmtDue(r.due)}</b> ${badge(r)}`:'<span style="color:var(--muted)">—</span>'}</td>
    <td><button class="btn green" style="padding:4px 10px;font-size:12px;white-space:nowrap" onclick="markReviewed(this.dataset.p,this)" data-p="${esc(r.p.path)}">✓ Mark reviewed</button></td>
  </tr>`;
  const section=(title,arr)=> arr.length?`<h3 style="color:var(--navy);margin:20px 0 8px">${title} <span style="color:var(--muted);font-weight:400;font-size:13px">(${arr.length})</span></h3>
    <table><thead><tr><th>Standard</th><th>Policy</th><th>Owner</th><th>Cadence</th><th>Last reviewed</th><th>Next due</th><th></th></tr></thead><tbody>${arr.map(line).join('')}</tbody></table>`:'';
  app.innerHTML=`
  <div class="stats">
    <div class="stat"><div class="n" style="color:var(--p1)">${overdue.length}</div><div class="l">Overdue</div></div>
    <div class="stat"><div class="n" style="color:var(--p2)">${soon.length}</div><div class="l">Due within 60 days</div></div>
    <div class="stat"><div class="n">${later.length}</div><div class="l">Scheduled later</div></div>
    <div class="stat"><div class="n">${asneeded.length}</div><div class="l">As needed / no date</div></div>
  </div>
  <div class="regnote">Dates come from each policy's cadence and last-reviewed date: <b>annual</b> → Aug 1, <b>quarterly</b> → Jan/Apr/Jul/Oct 1, <b>monthly</b> → the 15th, <b>semiannual</b> → Feb 1 &amp; Aug 1, <b>every 2–3 yrs</b> → Aug 1 of the target year. Set a policy's cadence in its editor (✎ Edit). "Mark reviewed" stamps today and rolls the next date forward.</div>
  ${section('⚠ Overdue',overdue)}
  ${section('Due soon',soon)}
  ${section('Upcoming',later)}
  ${section('As needed / no scheduled date',asneeded)}`;
}
async function markReviewed(path,btn){
  if(!confirm('Mark this policy reviewed as of today?\n\nUpdates its last-reviewed date and commits to GitHub; the next due date rolls forward from today.')) return;
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const r=await ghRead(path);
    const {fm,body}=parseFM(r.text);
    fm.last_reviewed=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'2-digit'});
    await ghWrite(path,buildFM(fm)+body,`Reviewed ${fm.id} — no content change [${cfg.name||'team'}]`,r.sha);
    const i=manifest.findIndex(p=>p.path===path);
    if(i>=0) manifest[i]={...manifest[i],last_reviewed:fm.last_reviewed};
    const writeM=async()=>{ shas['data/manifest.json']=await ghWrite('data/manifest.json',JSON.stringify(manifest,null,1),`Sync manifest: reviewed ${fm.id}`,shas['data/manifest.json']); };
    try{ await writeM(); }catch(e){ const m=await ghRead('data/manifest.json'); shas['data/manifest.json']=m.sha; await writeM(); }
    toast('Marked reviewed — schedule updated');
    renderReminders();
  }catch(e){ toast('Failed: '+e.message,true); if(btn){btn.disabled=false;btn.textContent='✓ Mark reviewed';} }
}
/* ================= supporting documents ================= */
async function ghTreePaths(){
  const r=await api(`git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
  if(!r.ok) throw new Error(`${r.status} reading file tree`);
  const j=await r.json();
  return (j.tree||[]).filter(t=>t.type==='blob').map(t=>t.path);
}
function parseDocsIndex(text,treePaths){
  const treeSet=new Set(treePaths);
  const lines=text.split('\n');
  const tableStart=lines.findIndex(l=>l.trim().startsWith('|'));
  const intro=tableStart>0?lines.slice(0,tableStart).join('\n').trim():'';
  const tRows=lines.slice(tableStart<0?lines.length:tableStart).filter(l=>l.trim().startsWith('|'));
  const cells=l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const header=tRows.length?cells(tRows[0]):[];
  const col=name=>header.findIndex(h=>new RegExp(name,'i').test(h));
  const iA=col('artifact'),iO=col('owner'),iL=col('location'),iR=col('referenced');
  const rows=tRows.slice(2).map(l=>{
    const c=cells(l);
    const artRaw=c[iA]||'';
    const artifact=artRaw.replace(/\*\(new\)\*/i,'').replace(/\*/g,'').trim();
    const isNew=/\*\(new\)\*/i.test(artRaw);
    const owner=c[iO]||'', refs=c[iR]||'', locRaw=c[iL]||'';
    const pm=locRaw.match(/`([^`]+)`/);
    let loc;
    if(pm&&treeSet.has(pm[1])) loc={type:'file',path:pm[1]};
    else if(pm) loc={type:'missing',path:pm[1]};
    else loc={type:'tbd',note:locRaw.replace(/\*\*/g,'').replace(/`/g,'').trim()};
    return {artifact,isNew,owner,refs,loc};
  });
  const linked=new Set(rows.filter(r=>r.loc.type==='file').map(r=>r.loc.path));
  const isDoc=p=>/\.(docx?|xlsx?|pptx?|pdf|csv)$/i.test(p);
  const extra=treePaths.filter(p=>isDoc(p)&&!linked.has(p)&&!/^audit\//.test(p));
  return {intro,rows,extra};
}
let docsCache=null;
async function renderDocuments(){
  app.innerHTML='<div class="spin">Loading supporting documents…</div>';
  try{
    if(!docsCache){
      const idx=await ghRead('supporting-documents/INDEX.md');
      const tree=await ghTreePaths();
      docsCache=parseDocsIndex(idx.text,tree);
    }
  }catch(e){
    app.innerHTML=`<div class="card"><b style="color:var(--p1)">Couldn't load supporting documents</b>
      <div style="margin-top:6px;color:var(--muted);font-size:13px">${esc(e.message)} — expected <code>supporting-documents/INDEX.md</code> in the repo.</div></div>`;
    return;
  }
  const {intro,rows,extra}=docsCache;
  const nFile=rows.filter(r=>r.loc.type==='file').length, nTbd=rows.length-nFile;
  const dl=(path,label)=>`<button class="btn green" style="padding:4px 10px;font-size:12px;white-space:nowrap" onclick="downloadDoc(this.dataset.p)" data-p="${esc(path)}">⬇ ${esc(label)}</button>`;
  const locCell=r=>{
    if(r.loc.type==='file'){
      const fn=r.loc.path.split('/').pop();
      const view=`https://github.com/${esc(cfg.repo)}/blob/${esc(cfg.branch)}/${encodeURI(r.loc.path)}`;
      return `${dl(r.loc.path,fn)} <a class="btn ghost" style="padding:4px 10px;font-size:12px;text-decoration:none;white-space:nowrap" target="_blank" href="${view}">View</a>`;
    }
    if(r.loc.type==='missing')
      return `<span class="pill P2">path not found</span> <span style="color:var(--muted);font-size:12px">${esc(r.loc.path)}</span>`;
    const extraNote=r.loc.note.replace(/^TBD\s*[—-]\s*/i,'').trim();
    return `<span class="pill P1">Location TBD</span>${extraNote&&!/^tbd$/i.test(r.loc.note)?`<div style="color:var(--muted);font-size:12px;margin-top:3px">${esc(extraNote)}</div>`:''}`;
  };
  app.innerHTML=`
  <div class="stats">
    <div class="stat"><div class="n">${rows.length}</div><div class="l">Referenced artifacts</div></div>
    <div class="stat"><div class="n">${nFile}</div><div class="l">In repo (downloadable)</div></div>
    <div class="stat"><div class="n">${nTbd}</div><div class="l">Location TBD</div></div>
  </div>
  ${intro?`<div class="card mdbody" style="font-size:13.5px">${marked.parse(intro)}</div>`:''}
  <table><thead><tr><th>Artifact</th><th>Owner</th><th>Document</th><th>Referenced by</th></tr></thead>
  <tbody>${rows.map(r=>`<tr>
    <td><b>${esc(r.artifact)}</b>${r.isNew?' <span class="pill P3">new</span>':''}</td>
    <td style="white-space:nowrap">${esc(r.owner.split('(')[0].trim())}</td>
    <td>${locCell(r)}</td>
    <td style="color:var(--muted);font-size:12.5px">${esc(r.refs)}</td>
  </tr>`).join('')}</tbody></table>
  ${extra.length?`<div class="card" style="margin-top:16px">
    <b>Other files committed to the repo but not in the index</b>
    <div class="regnote">Add these to <code>supporting-documents/INDEX.md</code> to record their owner and which policies reference them.</div>
    ${extra.map(p=>`<div style="margin:5px 0">${dl(p,p.split('/').pop())} <span style="color:var(--muted);font-size:12px">${esc(p)}</span></div>`).join('')}
  </div>`:''}`;
}
async function downloadDoc(path){
  const fn=path.split('/').pop();
  toast('Downloading '+fn+'…');
  try{
    const r=await api(`contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${encodeURIComponent(cfg.branch)}`);
    if(!r.ok) throw new Error(`${r.status}`);
    const j=await r.json();
    let blob;
    if(j.content){
      const bin=atob(j.content.replace(/\n/g,''));
      const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      blob=new Blob([arr]);
    }else if(j.download_url){
      blob=await (await fetch(j.download_url)).blob();
    }else throw new Error('empty response');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fn;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Downloaded '+fn);
  }catch(e){ toast('Download failed: '+e.message,true); }
}
/* ================= settings ================= */
function renderSettings(){
  app.innerHTML=`<div class="card" style="max-width:560px">
    <h2 style="color:var(--navy);margin-bottom:10px">Settings</h2>
    <p style="font-size:13.5px;line-height:1.6;margin-bottom:14px">Signed in as <b>${esc(cfg.name||'—')}</b> · connected to <b>${esc(cfg.repo)}</b> (branch <b>${esc(cfg.branch)}</b>). Every save is a git commit — the full change log is your policy revision history.</p>
    <button class="btn ghost" onclick="sessionStorage.removeItem('${CFG_KEY}');localStorage.removeItem('${CFG_KEY}');location.reload()">Sign out</button>
    <button class="btn ghost" style="margin-left:8px" onclick="renderSetup()">Admin: manual connection</button>
  </div>`;
}
boot();
</script>
